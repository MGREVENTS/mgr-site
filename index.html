<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--noir:#0A0A0A;--blanc:#F5F0EB;--or:#C9A84C;--bordeaux:#6B0F1A;--gris:#1A1A1A;--gris2:#2A2A2A;--gris-texte:#999;--border-subtle:rgba(255,255,255,.05);--border-accent:rgba(201,168,76,.08);--nav-bg:rgba(10,10,10,.78);--overlay-bg:rgba(0,0,0,.7);--ff-display:'Playfair Display',Georgia,serif;--ff-body:'DM Sans',system-ui,sans-serif}
html{scroll-behavior:smooth}body{background:var(--noir);color:var(--blanc);font-family:var(--ff-body);overflow-x:hidden;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}

nav{position:fixed;top:0;left:0;width:100%;z-index:100;padding:1rem 3rem;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(20px);background:var(--nav-bg);border-bottom:1px solid var(--border-accent);transition:background .4s}
.nav-logo img{height:32px;width:auto;filter:brightness(1.1)}
.nav-links{display:flex;gap:2.2rem;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.nav-links a{color:var(--gris-texte);transition:color .3s;position:relative;cursor:pointer}
.nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:1px;background:var(--or);transition:width .3s}
.nav-links a:hover{color:var(--blanc)}.nav-links a:hover::after{width:100%}
.nav-cta{font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;padding:.65rem 1.6rem;border:1px solid var(--or);color:var(--or);transition:all .3s;font-weight:500;cursor:pointer;background:none}
.nav-cta:hover{background:var(--or);color:var(--noir)}
.hamburger{display:none;background:none;border:none;cursor:pointer;padding:.5rem}
.hamburger svg{width:24px;height:24px}

.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;padding:6rem 2rem 4rem}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 85%,rgba(107,15,26,.3) 0%,transparent 55%),radial-gradient(ellipse at 80% 20%,rgba(201,168,76,.05) 0%,transparent 45%)}
.hero-tag{font-size:.7rem;letter-spacing:.35em;text-transform:uppercase;color:var(--or);margin-bottom:2.5rem;font-weight:500;opacity:0;animation:fadeUp .8s .3s forwards;display:flex;align-items:center;gap:1rem}
.diamond{width:6px;height:6px;background:var(--or);transform:rotate(45deg);display:inline-block;flex-shrink:0}
.hero h1{font-family:var(--ff-display);font-size:clamp(3rem,8vw,7.5rem);line-height:.95;font-weight:400;margin-bottom:1.8rem;opacity:0;animation:fadeUp .8s .5s forwards;position:relative;z-index:1}
.hero h1 em{font-style:italic;color:var(--or)}
.hero-sub{font-size:1.05rem;color:var(--gris-texte);max-width:500px;line-height:1.75;font-weight:300;opacity:0;animation:fadeUp .8s .7s forwards;position:relative;z-index:1}
.hero-scroll{position:absolute;bottom:2.5rem;display:flex;flex-direction:column;align-items:center;gap:.5rem;opacity:0;animation:fadeUp .8s 1.2s forwards}
.hero-scroll span{font-size:.6rem;letter-spacing:.25em;text-transform:uppercase;color:var(--gris-texte)}
.hero-scroll .line{width:1px;height:45px;background:linear-gradient(to bottom,var(--or),transparent);animation:scrollPulse 2s infinite}

.stats{display:flex;justify-content:center;gap:5rem;padding:3.5rem 2rem;border-top:1px solid rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.01)}
.stat{text-align:center;display:flex;flex-direction:column;align-items:center}
.stat svg{margin-bottom:.6rem;opacity:.35}
.stat-num{font-family:var(--ff-display);font-size:2.6rem;color:var(--or);line-height:1}
.stat-label{font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gris-texte);margin-top:.4rem}

.section-tag{font-size:.65rem;letter-spacing:.35em;text-transform:uppercase;color:var(--or);margin-bottom:1rem;font-weight:500;display:flex;align-items:center;gap:.7rem}
.section-title{font-family:var(--ff-display);font-size:clamp(2rem,4vw,3.2rem);line-height:1.15;margin-bottom:1.5rem}

.about{padding:8rem 3rem;display:grid;grid-template-columns:1fr 1fr;gap:5rem;max-width:1200px;margin:0 auto;align-items:center}

.about-visual{position:relative;aspect-ratio:4/5;border-radius:2px;overflow:hidden}
.about-visual img{width:100%;height:100%;object-fit:cover}
.about-visual.no-photo::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--bordeaux),var(--noir));opacity:.65}
.about-visual .av-placeholder{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1rem;z-index:1}
.about-visual.no-photo .av-placeholder{display:flex}
.about-visual .av-placeholder svg{opacity:.12}
.av-label{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.2)}

.brands{padding:8rem 3rem;max-width:1400px;margin:0 auto}
.brands-header{text-align:center;margin-bottom:5rem}
.brands-header .section-tag{justify-content:center}
.brands-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;max-width:1100px;margin:0 auto}
.brand-card{position:relative;aspect-ratio:2/3;overflow:hidden;border-radius:3px;cursor:pointer;border:1px solid rgba(255,255,255,.05);transition:border-color .5s,transform .5s}
.brand-card:hover{border-color:rgba(201,168,76,.4);transform:translateY(-8px)}
.brand-bg{position:absolute;inset:0;transition:transform .7s}.brand-card:hover .brand-bg{transform:scale(1.06)}
.brand-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:2rem}
.brand-icon{margin-bottom:auto}
.brand-icon img{height:50px;width:auto;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}
.brand-label{font-size:.58rem;letter-spacing:.3em;text-transform:uppercase;color:var(--or);margin-bottom:.5rem}
.brand-name{font-family:var(--ff-display);font-size:1.6rem;margin-bottom:.7rem}
.brand-desc{font-size:.82rem;color:var(--gris-texte);line-height:1.7;font-weight:300;margin-bottom:1.2rem}
.brand-link{font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;color:var(--or);display:inline-flex;align-items:center;gap:.5rem;transition:gap .3s}
.brand-link svg{width:14px;height:14px;transition:transform .3s}.brand-card:hover .brand-link svg{transform:translateX(4px)}

.djs{padding:8rem 3rem;max-width:1400px;margin:0 auto}
.djs-header{text-align:center;margin-bottom:4rem}
.djs-header .section-tag{justify-content:center}
.djs-header p{color:var(--gris-texte);font-weight:300;font-size:.95rem;max-width:500px;margin:0 auto}
.djs-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem}
.dj-card{border-radius:3px;overflow:hidden;border:1px solid rgba(255,255,255,.04);transition:border-color .4s,transform .4s;cursor:default}
.dj-card:hover{border-color:rgba(201,168,76,.3);transform:translateY(-5px)}
.dj-photo{aspect-ratio:3/4;background:var(--gris);position:relative;overflow:hidden}
.dj-photo img{width:100%;height:100%;object-fit:cover;object-position:top;position:relative;z-index:0}
.dj-photo::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,var(--noir),transparent 50%);z-index:1}
.dj-photo .dj-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.dj-photo .dj-placeholder svg{opacity:.08}
.dj-info{padding:1.2rem 1.4rem}
.dj-name{font-family:var(--ff-display);font-size:1.1rem;margin-bottom:.3rem}
.dj-style{font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:var(--or);font-weight:500}
.dj-venues{font-size:.75rem;color:var(--gris-texte);margin-top:.5rem;font-weight:300;line-height:1.6}
.dj-socials{display:flex;gap:.5rem;margin-top:.7rem}
.dj-socials a{width:28px;height:28px;border:1px solid rgba(255,255,255,.06);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .3s}
.dj-socials a:hover{border-color:var(--or);background:rgba(201,168,76,.1)}
.dj-socials a svg{width:11px;height:11px}
.djs-cta{text-align:center;margin-top:3.5rem}
.djs-cta-btn{display:inline-flex;align-items:center;gap:.6rem;padding:.8rem 2.2rem;border:1px solid rgba(201,168,76,.3);color:var(--or);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;font-weight:500;transition:all .3s;cursor:pointer;background:none}
.djs-cta-btn:hover{background:rgba(201,168,76,.08);border-color:var(--or)}

.trust{padding:6rem 3rem;text-align:center;border-top:1px solid rgba(255,255,255,.04)}
.trust .section-tag{justify-content:center;margin-bottom:3rem}
.trust-logos{display:flex;justify-content:center;align-items:center;gap:3.5rem;flex-wrap:wrap}
.trust-logo{opacity:.25;transition:opacity .4s;font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gris-texte)}.trust-logo:hover{opacity:.55}

.cta-section{padding:9rem 3rem;text-align:center;position:relative}
.cta-section::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(201,168,76,.07) 0%,transparent 55%)}
.cta-section .section-title,.cta-section p,.cta-btn{position:relative}
.cta-section p{color:var(--gris-texte);margin-bottom:2.8rem;font-size:1rem;font-weight:300}
.cta-btn{display:inline-flex;align-items:center;gap:.8rem;padding:1.1rem 3rem;background:var(--or);color:var(--noir);font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;transition:all .4s;border:none;cursor:pointer}
.cta-btn:hover{background:var(--blanc);transform:translateY(-3px);box-shadow:0 15px 50px rgba(201,168,76,.2)}

/* BRAND MODALS */
.brand-modal{position:fixed;inset:0;z-index:200;background:var(--noir);overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .5s}
.brand-modal.active{opacity:1;pointer-events:all}
.brand-modal-inner{max-width:1100px;margin:0 auto;padding:6rem 3rem 4rem}
.bm-back{position:fixed;top:1.2rem;left:1.5rem;z-index:210;display:flex;align-items:center;gap:.5rem;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gris-texte);cursor:pointer;background:rgba(10,10,10,.8);backdrop-filter:blur(12px);padding:.6rem 1.2rem;border:1px solid rgba(255,255,255,.06);border-radius:2px;transition:all .3s}
.bm-back:hover{color:var(--or);border-color:rgba(201,168,76,.3)}
.bm-back svg{width:16px;height:16px}
.bm-hero{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center;margin-bottom:5rem;min-height:70vh;padding-top:2rem}
.bm-tag{font-size:.62rem;letter-spacing:.35em;text-transform:uppercase;color:var(--or);margin-bottom:1rem;font-weight:500}
.bm-hero h2{font-family:var(--ff-display);font-size:clamp(2.2rem,5vw,3.8rem);line-height:1.05;margin-bottom:1.5rem}
.bm-hero h2 em{font-style:italic;color:var(--or)}
.bm-hero p{color:var(--gris-texte);line-height:1.85;font-weight:300;font-size:.95rem;margin-bottom:1rem}
.bm-visual{aspect-ratio:4/5;border-radius:3px;overflow:hidden;position:relative}
.bm-visual img{width:100%;height:100%;object-fit:cover;object-position:center 15%}
.bm-visual .bm-gradient{position:absolute;inset:0}
.bm-visual .bm-placeholder{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;z-index:1}
.bm-visual.no-photo .bm-placeholder{display:flex}
.bm-visual .bm-placeholder svg{opacity:.1}
.bm-visual .bm-placeholder span{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.2)}
.bm-features{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem;margin-bottom:5rem}
.bm-feature{padding:2rem;border:1px solid rgba(255,255,255,.04);border-radius:3px;transition:border-color .3s}
.bm-feature:hover{border-color:rgba(201,168,76,.15)}
.bm-feature h4{font-family:var(--ff-display);font-size:1.05rem;margin-bottom:.6rem}
.bm-feature p{font-size:.82rem;color:var(--gris-texte);line-height:1.7;font-weight:300}
.bm-stats{display:flex;justify-content:center;gap:4rem;padding:3rem 0;border-top:1px solid rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.04);margin-bottom:5rem}
.bm-stat-num{font-family:var(--ff-display);font-size:2.2rem;color:var(--or)}
.bm-stat-label{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gris-texte);margin-top:.3rem}
.bm-cta{text-align:center;padding:4rem 0}
.bm-cta h3{font-family:var(--ff-display);font-size:1.8rem;margin-bottom:1rem}
.bm-cta p{color:var(--gris-texte);font-weight:300;margin-bottom:2rem}

/* CONTACT MODAL */
.modal-overlay{position:fixed;inset:0;z-index:250;background:var(--overlay-bg);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}
.modal-overlay.active{opacity:1;pointer-events:all}
.modal{background:var(--gris);border:1px solid rgba(201,168,76,.12);border-radius:4px;width:90%;max-width:520px;padding:3rem;position:relative;transform:translateY(30px) scale(.97);transition:transform .4s cubic-bezier(.22,1,.36,1)}
.modal-overlay.active .modal{transform:translateY(0) scale(1)}
.modal-close{position:absolute;top:1.2rem;right:1.2rem;width:36px;height:36px;border:1px solid rgba(255,255,255,.08);border-radius:50%;background:none;color:var(--gris-texte);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s}
.modal-close:hover{border-color:var(--or);color:var(--or)}
.modal-close svg{width:16px;height:16px}
.modal h3{font-family:var(--ff-display);font-size:1.6rem;margin-bottom:2rem}
.form-row{margin-bottom:1.2rem}
.form-row label{display:block;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gris-texte);margin-bottom:.5rem;font-weight:500}
.form-row input,.form-row select,.form-row textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:2px;padding:.8rem 1rem;color:var(--blanc);font-family:var(--ff-body);font-size:.88rem;font-weight:300;transition:border-color .3s;outline:none}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--or)}
.form-row input::placeholder,.form-row textarea::placeholder{color:rgba(255,255,255,.2)}
.form-row select{appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='12' height='12' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='2' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 1rem center;cursor:pointer}
.form-row select option{background:var(--gris);color:var(--blanc)}
.form-row textarea{resize:vertical;min-height:100px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
.form-submit{width:100%;padding:.9rem;background:var(--or);color:var(--noir);font-family:var(--ff-body);font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;border:none;cursor:pointer;transition:all .3s;margin-top:.5rem;border-radius:2px}
.form-submit:hover{background:var(--blanc)}
.form-success{display:none;text-align:center;padding:2rem 0}
.form-success h4{font-family:var(--ff-display);font-size:1.3rem;margin-bottom:.5rem}
.form-success p{color:var(--gris-texte);font-size:.88rem;font-weight:300}

/* Carousel */
.bm-carousel{margin-bottom:4rem;position:relative}
.bm-carousel h3{font-family:var(--ff-display);font-size:1.3rem;margin-bottom:1.5rem;text-align:center}
.carousel-wrap{position:relative}
.carousel-track{display:flex;gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:1rem;scrollbar-width:none;scroll-behavior:smooth}
.carousel-track::-webkit-scrollbar{display:none}
.carousel-item{flex:0 0 280px;aspect-ratio:4/3;border-radius:3px;overflow:hidden;scroll-snap-align:start;cursor:pointer;position:relative;border:1px solid rgba(255,255,255,.04);transition:border-color .3s}
.carousel-item:hover{border-color:rgba(201,168,76,.3)}
.carousel-item img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.carousel-item:hover img{transform:scale(1.05)}
.carousel-arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:1px solid rgba(201,168,76,.3);background:rgba(10,10,10,.7);backdrop-filter:blur(8px);color:var(--or);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;transition:all .3s}
.carousel-arrow:hover{background:var(--or);color:var(--noir);border-color:var(--or)}
.carousel-arrow.left{left:-.5rem}
.carousel-arrow.right{right:-.5rem}
.carousel-arrow svg{width:16px;height:16px}
/* Lightbox */

/* — Signal ON AIR (nav) — */

.onair i{width:3px;height:100%;background:var(--or);transform-origin:bottom;animation:eqPulse .85s ease-in-out infinite alternate;box-shadow:0 0 6px rgba(201,168,76,.5)}
.onair i:nth-child(2){animation-delay:-.45s}.onair i:nth-child(3){animation-delay:-.7s}
.onair b{font-weight:500;font-size:.52rem;letter-spacing:.28em;color:var(--or);text-transform:uppercase;margin-left:.55rem;opacity:.85;align-self:center;white-space:nowrap}
@media(max-width:768px){.onair{display:none}}

/* — Waveform vivant (equalizer) — */
@keyframes eqPulse{from{transform:scaleY(.14)}to{transform:scaleY(var(--h,.9))}}
.eq-wave{display:flex;align-items:flex-end;gap:3px;height:58px;width:min(620px,78vw);margin-top:3rem;position:relative;z-index:1;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.eq-wave i{flex:1 1 0;border-radius:1px;background:linear-gradient(to top,rgba(201,168,76,.12),var(--or) 82%,#EAD48C);transform-origin:bottom;transform:scaleY(var(--h,.4));animation:eqPulse var(--t,1.1s) var(--d,0s) ease-in-out infinite alternate;box-shadow:0 0 10px rgba(201,168,76,.18)}
@media(max-width:768px){.eq-wave{height:44px;width:86vw;margin-top:2.4rem}}

/* — Faisceaux lumineux du hero — */
.hero-beams{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.9;filter:blur(4px);transform-origin:50% -10%;animation:beamSway 16s ease-in-out infinite alternate;
  background:conic-gradient(from 212deg at 8% -6%,transparent 0 9deg,rgba(201,168,76,.055) 13deg,transparent 23deg),
             conic-gradient(from 148deg at 92% -6%,transparent 0 9deg,rgba(107,15,26,.17) 14deg,transparent 26deg),
             radial-gradient(50% 34% at 50% 108%,rgba(107,15,26,.26),transparent 70%)}
@keyframes beamSway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.6deg)}}
.vinyl-stage--hero .vinyl{opacity:.22}

/* — Ticker éditorial (affiche de soirée) — */
.ticker{position:relative;overflow:hidden;padding:1.5rem 0;border-top:1px solid var(--border-accent);border-bottom:1px solid var(--border-accent);background:rgba(255,255,255,.008)}
.ticker-track{display:flex;width:max-content;will-change:transform;animation:tickerX 38s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker .th{display:flex;align-items:center;gap:3rem;padding-right:3rem}
.ticker .tw{font-family:var(--ff-display);font-style:italic;font-size:clamp(1.8rem,4vw,3.3rem);line-height:1.2;white-space:nowrap;color:transparent;-webkit-text-stroke:1px rgba(245,240,235,.34)}
.ticker .tw-fill{color:var(--or);-webkit-text-stroke:0}
.ticker .td{width:9px;height:9px;background:var(--or);transform:rotate(45deg);flex:0 0 auto;opacity:.85}
.ticker--rev .ticker-track{animation-direction:reverse}
.ticker--soft .tw{-webkit-text-stroke-color:rgba(201,168,76,.3)}
.ticker--soft .tw-fill{color:var(--blanc);opacity:.85;-webkit-text-stroke:0}
@keyframes tickerX{to{transform:translateX(-50%)}}
@media(max-width:768px){.ticker{padding:1.1rem 0}.ticker .th{gap:1.8rem;padding-right:1.8rem}.ticker .tw{font-size:1.65rem}.ticker .td{width:6px;height:6px}}

/* — Numéros de section éditoriaux (au trait) — */
.about,.brands,.djs{position:relative}
.sec-index{position:absolute;top:2rem;font-family:var(--ff-display);font-style:italic;font-size:clamp(6.5rem,15vw,12rem);line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(201,168,76,.13);pointer-events:none;user-select:none}
.sec-index--l{left:3rem}.sec-index--r{right:3rem}
@media(max-width:768px){.sec-index{font-size:4.8rem;top:1.2rem}.sec-index--l{left:1.2rem}.sec-index--r{right:1.2rem}}

/* — Photos : couleurs originales conservées (duotone retiré) — */

/* — Cartes DJ : hauteur uniforme, réseaux calés en bas — */
.djs-grid{grid-auto-rows:1fr}
.dj-card{display:flex;flex-direction:column;height:100%}
.dj-photo{flex:0 0 auto}
.dj-info{display:flex;flex-direction:column;flex:1}
.dj-socials{margin-top:auto;padding-top:.7rem}

/* — Mini equalizer sur les cartes DJ — */
.dj-photo{position:relative}
.dj-eq{position:absolute;left:.85rem;bottom:.85rem;z-index:2;display:flex;align-items:flex-end;gap:3px;height:15px;opacity:0;transform:translateY(4px);transition:opacity .35s var(--ease-out),transform .35s var(--ease-out)}
.dj-eq i{width:3px;height:100%;background:var(--or);transform-origin:bottom;transform:scaleY(.3);animation:eqPulse .75s ease-in-out infinite alternate;animation-play-state:paused;box-shadow:0 0 6px rgba(201,168,76,.6)}
.dj-eq i:nth-child(2){animation-delay:-.5s}.dj-eq i:nth-child(3){animation-delay:-.2s}.dj-eq i:nth-child(4){animation-delay:-.65s}.dj-eq i:nth-child(5){animation-delay:-.35s}
.dj-card:hover .dj-eq{opacity:1;transform:none}
.dj-card:hover .dj-eq i{animation-play-state:running}

/* — CTA : mot géant au trait + reflet sur bouton — */
.cta-section{overflow:hidden}
.cta-backword{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);font-family:var(--ff-display);font-style:italic;white-space:nowrap;font-size:clamp(4.5rem,16vw,13rem);color:transparent;-webkit-text-stroke:1px rgba(201,168,76,.1);pointer-events:none;user-select:none;z-index:0}
.cta-btn{position:relative;overflow:hidden}
.cta-btn::before{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-22deg);transition:left .55s var(--ease-out);pointer-events:none}
.cta-btn:hover::before{left:125%}

/* — Reduced motion : couche décorative neutralisée — */
@media(prefers-reduced-motion:reduce){
  .fx-spot,.scroll-progress{display:none!important}
  .eq-wave i,.onair i,.dj-eq i,.ticker-track,.hero-beams{animation:none!important}
}
</style>
<style>
/* ════════ SCROLL CINÉMATIQUE (référence Ferrari) — animations liées au défilement ════════ */
/* Stabilité mobile : aucun débordement horizontal possible */
html,body{overflow-x:clip}

/* Sortie de hero en parallaxe : le contenu s'élève et s'estompe pendant le scroll */
.hero{opacity:calc(1 - min(var(--hx,0),1)*.92)}
.hero h1{translate:0 calc(var(--hx,0)*-46px)}
.hero-sub{translate:0 calc(var(--hx,0)*-30px)}
.hero-tag{translate:0 calc(var(--hx,0)*-20px)}
.hero .cta-btn{translate:0 calc(var(--hx,0)*-14px)}
.hero .eq-wave{translate:0 calc(var(--hx,0)*-8px)}
.vinyl-stage--hero{translate:0 calc(var(--hx,0)*46px)}

/* Révélation des médias au scroll (scrub) : dézoom + ouverture du cadre */
.about-visual{clip-path:inset(calc((1 - var(--p,1))*9%) round 2px)}
.dj-photo img{scale:calc(1.1 - var(--p,1)*.1)}
.sec-index{translate:0 calc((1 - var(--p,1))*56px);opacity:calc(.25 + var(--p,1)*.75)}

@media(prefers-reduced-motion:reduce){
  .hero{opacity:1}

  .about-visual{clip-path:none}
  .dj-photo img{scale:none}
}
</style>
<style>
/* ════════ SCÈNE VIVANTE — dégradés animés (Apple × Porsche × Pioneer DJ) ════════ */
body{background:#050505}
.bg-scene{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#0B0A0C 0%,#050505 58%)}
.bg-scene i{display:block}
.bg-scene .blob{position:absolute;border-radius:50%;filter:blur(90px);mix-blend-mode:screen;will-change:transform}
.blob--or{width:58vmax;height:58vmax;top:-20vmax;left:-14vmax;opacity:.5;background:radial-gradient(circle at 36% 36%,rgba(201,168,76,.34),rgba(201,168,76,.05) 52%,transparent 70%);animation:blobA 36s ease-in-out infinite alternate}
.blob--bdx{width:66vmax;height:66vmax;bottom:-26vmax;right:-18vmax;opacity:.6;background:radial-gradient(circle at 62% 58%,rgba(107,15,26,.55),rgba(107,15,26,.1) 52%,transparent 72%);animation:blobB 44s ease-in-out infinite alternate}

.blob--mag{width:40vmax;height:40vmax;bottom:6%;left:-12vmax;opacity:.38;background:radial-gradient(circle,rgba(146,22,58,.3),transparent 64%);animation:blobD 39s ease-in-out infinite alternate}
@keyframes blobA{to{transform:translate(10vmax,8vmax) scale(1.22) rotate(14deg)}}
@keyframes blobB{to{transform:translate(-9vmax,-10vmax) scale(1.16) rotate(-10deg)}}
@keyframes blobC{to{transform:translate(-8vmax,10vmax) scale(1.28)}}
@keyframes blobD{to{transform:translate(9vmax,-7vmax) scale(1.2)}}
/* Traînées lumineuses (light trails Porsche) */
.bg-scene .streak{position:absolute;left:-35%;width:170%;height:2px;filter:blur(1.5px);opacity:0;background:linear-gradient(90deg,transparent,rgba(234,212,140,.55) 45%,rgba(234,212,140,.15) 55%,transparent);will-change:transform,opacity}

@keyframes streakPass{0%,78%{opacity:0;transform:translateX(-10%) rotate(var(--sa,-13deg))}86%{opacity:.65}94%,100%{opacity:0;transform:translateX(12%) rotate(var(--sa,-13deg))}}

/* — Titres à reflet métallique (Apple) — */
.section-title{background:linear-gradient(112deg,#F5F0EB 32%,#CFC4B0 46%,#FBEECB 51%,#F5F0EB 64%);background-size:230% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sheenPan 10s ease-in-out infinite}
.bm-hero h2{background:linear-gradient(112deg,#F5F0EB 32%,#CFC4B0 46%,#FBEECB 51%,#F5F0EB 64%);background-size:230% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sheenPan 10s ease-in-out infinite}
.bm-hero h2 em{-webkit-text-fill-color:var(--or)}
@keyframes sheenPan{0%,100%{background-position:0% 0}50%{background-position:100% 0}}

/* — Lueurs néon (Pioneer) — */
.vinyl{box-shadow:inset 0 0 90px rgba(0,0,0,.85),inset 0 0 22px rgba(0,0,0,.95),0 0 70px -16px rgba(201,168,76,.3),0 0 140px -40px rgba(107,15,26,.55);border:1px solid rgba(201,168,76,.12)}

.cta-section::before{animation:ctaBreath 8s ease-in-out infinite}
@keyframes ctaBreath{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}

@media(max-width:768px){
  .bg-scene .blob{filter:blur(60px)}

}
@media(prefers-reduced-motion:reduce){

}

let lastFocused=null;
function focusIn(sel){ const el=document.querySelector(sel); if(el) setTimeout(()=>{try{el.focus();}catch(e){}}, 60); }
function restoreFocus(){ if(lastFocused&&lastFocused.focus){ try{lastFocused.focus();}catch(e){} } lastFocused=null; }
function openBrand(id){ const el=document.getElementById('bm-'+id); if(el){lastFocused=document.activeElement;el.classList.add('active');el.scrollTop=0;document.body.style.overflow='hidden';focusIn('#bm-'+id+' .bm-back');history.pushState({modal:'brand',id},'','#'+id);} }

// Focus trap dans la modale ouverte
document.addEventListener('keydown', e => {
  if(e.key!=='Tab') return;
  const modal = document.querySelector('.modal-overlay.active, .brand-modal.active');
  if(!modal) return;
  const nodes = [...modal.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')]
    .filter(el => el.offsetWidth>0 || el.offsetHeight>0 || el===document.activeElement);
  if(!nodes.length) return;
  const first=nodes[0], last=nodes[nodes.length-1];
  if(e.shiftKey){ if(document.activeElement===first || !modal.contains(document.activeElement)){ e.preventDefault(); last.focus(); } }
  else { if(document.activeElement===last || !modal.contains(document.activeElement)){ e.preventDefault(); first.focus(); } }
});

async function submitForm(e) {

  } catch (err) {
    btn.textContent = 'Erreur — Réessayer';
    btn.disabled = false;
    console.error('Contact form error:', err);
  }
  return false;
}

<script>
/* ════════ PREMIUM ENHANCEMENTS — scroll · parallax · micro-interactions ════════ */
(function(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const nav = document.querySelector('nav');

  // Hero title — reveal mot par mot + shimmer or
  (function splitHero(){
    const h1 = document.querySelector('.hero h1');
    if(!h1 || reduce || h1.classList.contains('split')) return;
    const orig = h1.innerHTML;
    try{
      let idx = 0;
      const frag = document.createDocumentFragment();
      const delay = () => ((0.06 + idx++ * 0.07).toFixed(2)) + 's';
      h1.childNodes.forEach(node => {
        if(node.nodeType === 3){
          node.textContent.split(/(\s+)/).forEach(part => {
            if(part === '') return;
            if(/^\s+$/.test(part)){ frag.appendChild(document.createTextNode(part)); return; }
            const w = document.createElement('span'); w.className = 'hw';
            const i = document.createElement('span'); i.className = 'hw-i';
            i.textContent = part; i.style.transitionDelay = delay();
            w.appendChild(i); frag.appendChild(w);
          });
        } else if(node.nodeName === 'BR'){
          frag.appendChild(document.createElement('br'));
        } else if(node.nodeName === 'EM'){
          const w = document.createElement('span'); w.className = 'hw';
          const em = document.createElement('em'); em.className = 'hw-i';
          em.textContent = node.textContent; em.style.transitionDelay = delay();
          w.appendChild(em); frag.appendChild(w);
        } else {
          frag.appendChild(node.cloneNode(true));
        }
      });
      h1.innerHTML = ''; h1.appendChild(frag); h1.classList.add('split');
      requestAnimationFrame(() => requestAnimationFrame(() => h1.classList.add('in')));
    }catch(e){ h1.innerHTML = orig; }
  })();

  // Mobile menu (glass slide)
  window.toggleMenu = function(btn){
    if(!nav) return;
    const open = nav.classList.toggle('menu-open');
    if(btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  };
  document.querySelectorAll('.nav-links a').forEach(a =>
    a.addEventListener('click', () => nav && nav.classList.remove('menu-open')));
  addEventListener('resize', () => { if(innerWidth > 768 && nav) nav.classList.remove('menu-open'); }, {passive:true});

  // Sticky nav state
  function navState(){ if(nav) nav.classList.toggle('scrolled', scrollY > 40); }

  // Light parallax (about visual)
  const pxEls = [...document.querySelectorAll('.about-visual')]
    .map(el => ({ el, img: el.querySelector('img') }))
    .filter(p => p.img);
  function parallax(){
    if(reduce || innerWidth <= 768) return;
    const vh = innerHeight;
    for(const p of pxEls){
      const r = p.el.getBoundingClientRect();
      if(r.bottom < -60 || r.top > vh + 60) continue;
      const off = (r.top + r.height/2) - vh/2;
      const max = r.height * 0.09;
      let ty = -off * 0.09;
      if(ty > max) ty = max; else if(ty < -max) ty = -max;
      p.img.style.transform = 'translate3d(0,' + ty.toFixed(1) + 'px,0) scale(1.2)';
    }
  }

  // rAF-throttled scroll loop
  let ticking = false;
  function onScroll(){
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(() => { navState(); parallax(); ticking = false; });
  }
  addEventListener('scroll', onScroll, {passive:true});
  addEventListener('resize', onScroll, {passive:true});
  navState(); parallax();

  // Count-up stats
  function countUp(el){
    const m = el.textContent.trim().match(/^(\d[\d\s]*)(.*)$/);
    if(!m) return;
    const target = parseInt(m[1].replace(/\s/g,''), 10);
    const suffix = m[2] || '';
    if(isNaN(target)) return;
    if(reduce){ el.textContent = target + suffix; return; }
    const dur = 1500, t0 = performance.now();
    (function tick(now){
      const p = Math.min((now - t0) / dur, 1);
      el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))) + suffix;
      if(p < 1) requestAnimationFrame(tick);
    })(t0);
  }

  if('IntersectionObserver' in window){
    const statObs = new IntersectionObserver(es => {
      es.forEach(e => { if(e.isIntersecting){ e.target.querySelectorAll('.stat-num').forEach(countUp); statObs.unobserve(e.target); } });
    }, { threshold: 0.4 });
    const statsEl = document.querySelector('.stats');
    if(statsEl) statObs.observe(statsEl);

    // Pause vinyl when offscreen (perf)
    const vinylObs = new IntersectionObserver(es => {
      es.forEach(e => e.target.classList.toggle('paused', !e.isIntersecting));
    }, { threshold: 0 });
    document.querySelectorAll('[data-vinyl]').forEach(el => vinylObs.observe(el));
  }
})();
</script>
<script>
/* ════════ ENTERTAINMENT LAYER — waveform vivant · spotlight · progression ════════ */
(function(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Waveform : barres générées avec hauteur/tempo aléatoires (orgue de lumière)
  document.querySelectorAll('[data-eq]').forEach(w => {
    const n = parseInt(w.dataset.eq, 10) || 44;
    let html = '';
    for(let i = 0; i < n; i++){
      html += '<i style="--h:' + (0.22 + Math.random()*0.78).toFixed(2)
            + ';--t:' + (0.7 + Math.random()*0.9).toFixed(2) + 's'
            + ';--d:-' + (Math.random()*1.6).toFixed(2) + 's"></i>';
    }
    w.innerHTML = html;
  });

  // Progression + scrub cinématique lié au scroll (référence Ferrari)
  const prog = document.querySelector('.scroll-progress');
  const heroEl = document.querySelector('.hero');
  const scrubs = Array.from(document.querySelectorAll('[data-scrub]'));
  let tick = false;
  function upd(){
    try{
      const de = document.documentElement;
      if(prog && de){ const max = de.scrollHeight - innerHeight; prog.style.width = (max > 0 ? (scrollY / max) * 100 : 0) + '%'; }
      if(!reduce){
        const vh = Math.max(innerHeight, 1);
        if(heroEl) heroEl.style.setProperty('--hx', Math.min(scrollY / vh, 1).toFixed(3));
        for(const el of scrubs){
          const r = el.getBoundingClientRect();
          const p = Math.min(1, Math.max(0, (vh - r.top) / (vh * .72)));
          el.style.setProperty('--p', p.toFixed(3));
        }
      }
    }catch(e){}
    tick = false;
  }
  addEventListener('scroll', () => { if(!tick){ tick = true; requestAnimationFrame(upd); } }, {passive:true});
  addEventListener('resize', () => { if(!tick){ tick = true; requestAnimationFrame(upd); } }, {passive:true});
  upd();

  // Spotlight : halo doré qui suit le curseur (pointeur précis uniquement)
  const spot = document.querySelector('.fx-spot');
  if(spot && !reduce && matchMedia('(pointer:fine)').matches){
    let x = innerWidth/2, y = innerHeight/3, tx = x, ty = y, raf = null, on = false;
    function loop(){
      x += (tx - x) * .09; y += (ty - y) * .09;
      spot.style.transform = 'translate(' + (x - 260).toFixed(1) + 'px,' + (y - 260).toFixed(1) + 'px)';
      if(Math.abs(tx - x) > .5 || Math.abs(ty - y) > .5){ raf = requestAnimationFrame(loop); } else { raf = null; }
    }
    addEventListener('mousemove', e => {
      tx = e.clientX; ty = e.clientY;
      if(!on){ on = true; document.body.classList.add('spot-on'); }
      if(!raf) raf = requestAnimationFrame(loop);
    }, {passive:true});
  }
})();
</script>
